<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css card Design</title>
    <style>
      *{
        margin: 0;
        padding: 0;
      }
      body {
        background-color: grey;
        padding: 45px;
      }
      .card {
        background-color: white;
        width: 200px;
        border-radius: 3px;
        padding: 0 0 34px 0;
      }

      .image {
        padding: 5px;
        border-radius: 7px;
      }
      .image img {
        border-radius: 7px;
      }
      .content {
        padding: 3px 13px;
      }
      .content p {
        font-size: 9px;
        color: gray;
      }
      .capsules {
        padding: 0 34px 0 14px;
      }
      .capsules span {
        border: 1px solid black;
        padding: 2px 4px;
        border-radius: 7px;
        font-size: 8px;
        font-family: 'Baloo bhai 1',
        sans-serif;
      }
      .button{
        text-align: center;
      }
      .button button{
        padding: 3px 5px;
        border-radius: 15px;
        background-color: rgb(194, 194, 199);
        color: blue;
        font-size: 8px;
        margin-top: 5px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="image">
        <img
          width="188px"
          src="https://images.pexels.com/photos/3880179/pexels-photo-3880179.jpeg"
          alt=""
        />
      </div>

      <div class="capsules">
        <span>Nature</span>
        <span>Lake</span>
      </div>
      <div class="content">
      <h2>Harry</h2>
      <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quia
        necessitatibus, qui hic rerum alias aperiam minus possimus itaque iure,
        nisi voluptatem!ywerfrekhn...
      </p>
    </div>
    <div class="button">
      <button>Read More</button>
    </div>
    </div>
  </body>
</html>
