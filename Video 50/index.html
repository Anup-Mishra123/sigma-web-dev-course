<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css filters</title>
    <style>
       /*  img{
            filter:blur(10px);
        }
 */
        .img1{
            filter: brightness(122%);
            height: 25px;
            width:35px;
        }
        .img2{
            filter: grayscale(20%);
        }
        .img3{
            filter: drop-shadow(20%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="imag1" src="https://media.istockphoto.com/id/1530973530/photo/software-development-concept.jpg?s=612x612&w=0&k=20&c=6orMyiQvcIIrx4vlL4cMNZT0hFQ7M_FU8uZc9PQ_0-g=" alt="">
        <img class="imag2"src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQvnMVFksvJJVAHXi6IG8mpItoL6IwAInKQQ&s" alt="">
        <img class="imag3"src="https://m.media-amazon.com/images/I/71JpqeRGZOL._AC_UF894,1000_QL80_.jpg" alt="">
    </div>
</body>
</html>
