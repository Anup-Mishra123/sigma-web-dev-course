<!DOCTYPE html>
<html lang="en">
<head>

    <style>
 /*        .boxes *{

      /*   .box:nth-child(even){

        .boxes::before{
            content: "harry is good";
            color:blue;
        }

        .boxes::after{
            content: "Sigtma course is also good";
            color: red;
        }

        .boxes::selection{
            color:aqua;
        }

        .box::first-letter{
            color: blueviolet;
            font-size: 45px;
        }

        input::placeholder{
            color: rgb(68, 65, 210);
        }
    </style>
</head>

<body>
      <div data-color="primary" class="boxes">
      <div class="box">I am first box</div>
      <div class="box">Hey I am a box</div>
      <div class="box">Hey I am a box</div>
      <input type="text" placeholder="Type your name here">
    </div>
</body>
