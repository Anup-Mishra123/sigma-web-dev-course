<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css multicolor website</title>
    <style>

        :root{
            --primary-color: rgb(129, 129, 245);
            --text-color: white;
            --secondary-color: rgb(201, 119, 119);
        }

        body{
            background-color: var(--secondary-color);
        }
        *{
            margin: 0;
            padding: 0;
        }
        nav{
            background-color:var(--primary-color);
            padding: 12px 0;
        }
        ul li{
            list-style: none;
            display:inline;
            padding: 23px;
            font-weight: bolder;
            color:white;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>services</li>
                <li>contact us</li>
            </ul>
        </nav>
    </header>
</body>
</html>
